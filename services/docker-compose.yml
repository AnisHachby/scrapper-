version: '3.8'

services:
  # API Gateway (Traefik)
  api-gateway:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bvc-network
    restart: unless-stopped

  # API Service - Exposed REST endpoints
  api-service:
    build:
      context: ../..
      dockerfile: services/api_service/Dockerfile
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - ml-service
      - redis
    networks:
      - bvc-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Service - Model inference
  ml-service:
    build:
      context: ../..
      dockerfile: services/ml_service/Dockerfile
    environment:
      - MODEL_PATH=/models/model.joblib
      - LOG_LEVEL=info
    volumes:
      - ../../data/processed:/models:ro
    networks:
      - bvc-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service - Background tasks
  worker:
    build:
      context: ../..
      dockerfile: services/worker_service/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    volumes:
      - ../../data:/data
    depends_on:
      - redis
    networks:
      - bvc-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  # Redis - Cache and task queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bvc-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - Static files
  frontend:
    build:
      context: ../..
      dockerfile: services/frontend/Dockerfile
    networks:
      - bvc-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped

volumes:
  redis_data:

networks:
  bvc-network:
    driver: bridge
